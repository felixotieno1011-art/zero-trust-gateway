name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up test environment
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gateway_test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "PGUSER=postgres" >> $GITHUB_ENV
          echo "PGHOST=localhost" >> $GITHUB_ENV
          echo "PGPASSWORD=postgres" >> $GITHUB_ENV

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Diagnose Postgres connectivity
        run: |
          echo "psql version:"
          psql --version
          echo ""
          echo "Connection test (TCP):"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "SELECT version();" || true
          echo ""
          echo "Connection test (socket):"
          psql -U postgres -d postgres -c "SELECT 1;" || true
          echo ""
          echo "Env vars:"
          env | grep -E "^PG|^DATABASE|^REDIS" || true

      - name: Run tests
        run: pytest -v

  docker:
    name: Build and smoke-test Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config > /dev/null

      - name: Build images
        run: docker compose build

      - name: Set test secrets
        run: |
          cat > .env << EOF
          JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          POSTGRES_PASSWORD=test_password
          EOF

      - name: Start stack
        run: docker compose up -d

      - name: Wait for gateway to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health; then
              echo ""
              echo "Gateway is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become healthy"
          docker compose logs gateway
          exit 1

      - name: Smoke test — register, login, hit protected backend
        run: |
          set -x
          echo "=== Register ==="
          curl -sS -w "\nHTTP %{http_code}\n" -X POST http://localhost:8080/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"testpassword123"}' | tee register.out

          echo "=== Login ==="
          curl -sS -w "\nHTTP %{http_code}\n" -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"testpassword123"}' | tee login.out

          TOKEN=$(python -c "import json; print(json.load(open('login.out'))['access_token'])" 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "No access_token in login response. Container logs:"
            docker compose logs auth_service --tail=50
            exit 1
          fi

          echo "=== Protected backend ==="
          curl -sS -w "\nHTTP %{http_code}\n" http://localhost:8080/api/a/hello \
            -H "Authorization: Bearer $TOKEN" | tee response.json

          echo "=== Verify identity injection ==="
          grep -q "ci@example.com" response.json

      - name: Smoke test — WAF blocks SQLi
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8080/api/a/echo?id=1'%20OR%20'1'='1" \
            -H "Authorization: Bearer invalid")
          [ "$CODE" = "403" ] || (echo "Expected 403, got $CODE"; exit 1)

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
